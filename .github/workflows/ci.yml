name: CI

# Trava regressões antes de chegar em produção: tipos, lint e build em cada
# push/PR para a branch principal.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # As duas travas que rodam sem banco. Estavam fora do CI: eram rodadas à
      # mão e por isso só protegiam quem lembrava de rodar.
      - name: Regras de acesso (quem pode o quê)
        run: npm run test:papeis
      # 13/08 — a tela é lida por quem não conhece o sistema. Falha se voltar
      # "lead", "pool", "esteira" ou "board" ao texto visível do HM.
      # Ver docs/plano-sistema-para-quem-opera.md.
      - name: Vocabulário das telas
        run: npm run test:vocabulario
      - name: Build
        run: npm run build
        env:
          # O build não acessa o banco (rotas são dinâmicas), mas garantimos que
          # variáveis lidas em import-time não quebrem o build.
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          APP_PASSWORD: ci-placeholder
          SESSION_SECRET: ci-placeholder-secret-please-change
